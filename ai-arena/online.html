<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI 双人手机联机</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0d1426;
      color: #f7f9ff;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #lobby-view {
      width: 100%;
      height: 100dvh;
      overflow-y: auto;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #203657 0, #0d1426 85%);
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #18253c;
      border: 1px solid #354963;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-link {
      color: #7af0c4;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      color: #fff;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    select, input {
      flex: 1;
      height: 48px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid #405573;
      background: #0f192b;
      color: #fff;
      font-size: 16px;
      user-select: text;
      -webkit-user-select: text;
    }
    button.btn {
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-primary {
      background: #7af0c4;
      color: #102d30;
    }
    .btn-secondary {
      background: #284163;
      color: #e4f0ff;
      border: 1px solid #45628a;
    }
    .btn-full {
      width: 100%;
      margin-top: 8px;
    }
    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #101b2e;
      color: #7af0c4;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }
    #game-view {
      position: fixed;
      inset: 0;
      background: #090e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #game-view[hidden], #lobby-view[hidden] {
      display: none !important;
    }
    #screen {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .hud-overlay {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(13, 20, 38, 0.78);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(122, 240, 196, 0.35);
      font-size: 12px;
      color: #d8f5ea;
      z-index: 20;
    }
    .hud-overlay button {
      background: #7af0c4;
      color: #0e2629;
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    #pad {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    .pad-left, .pad-right {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      display: grid;
      gap: 10px;
      pointer-events: auto;
    }
    .pad-left {
      left: max(16px, env(safe-area-inset-left));
      grid-template-columns: repeat(2, 66px);
    }
    .pad-right {
      right: max(16px, env(safe-area-inset-right));
      grid-template-columns: repeat(3, 62px);
    }
    .pad-btn {
      height: 62px;
      border-radius: 50%;
      background: rgba(32, 61, 82, 0.68);
      border: 2px solid rgba(122, 240, 196, 0.65);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      backdrop-filter: blur(2px);
      transition: transform 0.05s, background 0.05s;
    }
    .pad-btn.active {
      background: rgba(122, 240, 196, 0.9);
      color: #0d2329;
      transform: scale(0.92);
    }
    .pad-btn.wide {
      grid-column: span 2;
      border-radius: 32px;
    }
    #rotate-tip {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 16, 30, 0.96);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #rotate-tip span {
      font-size: 52px;
      margin-bottom: 14px;
      animation: tilt 1.6s infinite ease-in-out;
    }
    @keyframes tilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: portrait) {
      #game-view:not([hidden]) ~ #rotate-tip {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="lobby-view">
    <div class="card">
      <div class="top-bar">
        <a class="back-link" href="../web-prototype/index.html">← 返回首页</a>
        <span style="font-size:12px;color:#8ba1bd;">公网双人实时联机</span>
      </div>
      <h2>AI 双人手机联机</h2>
      <div id="setup">
        <div class="row">
          <select id="mode">
            <option value="fight">🥊 AI 神经格斗</option>
            <option value="race">🏎️ 云端障碍赛</option>
          </select>
          <select id="character">
            <option value="gpt">GPT · 协议斗士</option>
            <option value="deepseek">DeepSeek · 深海求索</option>
            <option value="claude">Claude · 赭色守望</option>
            <option value="gemini">Gemini · 双子跃迁</option>
          </select>
        </div>
        <button id="create" class="btn btn-primary btn-full">创建房间并生成邀请码</button>
        <div class="row" style="margin-top:14px;margin-bottom:0;">
          <input id="code" placeholder="输入6位房间码" inputmode="numeric" pattern="[0-9]*" maxlength="6">
          <button id="join" class="btn btn-secondary">加入房间</button>
        </div>
      </div>

      <div id="room-actions" hidden>
        <button id="ready" class="btn btn-primary btn-full">我已准备好（开始对局）</button>
        <button id="share" class="btn btn-secondary btn-full">复制好友邀请链接</button>
      </div>

      <div id="status">选择角色后创建房间，或输入好友发来的六位房间码。</div>
    </div>
  </div>

  <div id="game-view" hidden>
    <div class="hud-overlay">
      <span id="hud-text">连接中...</span>
      <button id="hud-ready" hidden>再来一局</button>
      <button id="hud-exit" style="background:#384d6b;color:#fff;">退出</button>
    </div>
    <canvas id="screen" width="1280" height="720"></canvas>
    <div id="pad"></div>
  </div>

  <div id="rotate-tip">
    <span>📱</span>
    <h3 style="margin:0 0 8px;">请将手机横屏游玩</h3>
    <p style="margin:0;color:#9eb2c9;font-size:14px;">关闭手机“竖屏锁定”后横置屏幕，即可解锁双拇指掌机手柄</p>
  </div>

  <script src="fight.js"></script>
  <script src="race.js"></script>
  <script src="render.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="online.js"></script>
</body>
</html>
