<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI 双人手机联机</title>
  <link rel="stylesheet" href="style.css?v=landscape-1.3.0">
</head>
<body>
  <div id="lobby-view">
    <div class="card">
      <div class="top-bar">
        <a class="back-link" href="../web-prototype/index.html">← 返回首页</a>
        <span style="font-size:12px;color:#8ba1bd;">公网双人实时联机</span>
      </div>
      <h2>AI 双人手机联机</h2>
      <div id="setup">
        <div class="row" role="group" aria-label="选择游戏模式">
          <button type="button" class="btn btn-primary" id="mode-fight" aria-pressed="true">格斗模式</button>
          <button type="button" class="btn btn-secondary" id="mode-race" aria-pressed="false">派对模式</button>
        </div>
        <p id="mode-help" style="color:#a9bfd8;font-size:13px">创建房间时确定模式；加入房间自动跟随房主。</p>
        <div class="row">
          <select id="mode" hidden aria-label="当前模式">
            <option value="fight">🥊 AI 神经格斗</option>
            <option value="race">派对模式</option>
          </select>
          <select id="character">
            <option value="gpt">奶娃</option>
            <option value="deepseek">咕咕嘎嘎</option>
            <option value="claude">豆包</option>
            <option value="gemini">猪猪侠</option>
          </select>
        </div>
        <button id="create" class="btn btn-primary btn-full">创建房间并生成邀请码</button>
        <div class="row" style="margin-top:14px;margin-bottom:0;">
          <input id="code" placeholder="输入6位房间码" inputmode="numeric" pattern="[0-9]*" maxlength="6">
          <button id="join" class="btn btn-secondary">加入房间</button>
        </div>
      </div>

      <div id="room-actions" hidden>
        <button id="ready" class="btn btn-primary btn-full">我已准备好（开始对局）</button>
        <button id="share" class="btn btn-secondary btn-full">复制好友邀请链接</button>
      </div>

      <div id="status">选择角色后创建房间，或输入好友发来的六位房间码。</div>
    </div>
  </div>

  <div id="game-view" hidden>
    <div class="hud-overlay">
      <span id="hud-text">连接中...</span>
      <button id="hud-ready" hidden>再来一局</button>
      <button id="hud-exit" style="background:#384d6b;color:#fff;">退出</button>
    </div>
    <canvas id="screen" tabindex="0" aria-label="游戏画面，支持键盘与触屏操控" width="1280" height="720"></canvas>
    <div id="pad"></div><div id="input-help" style="position:absolute;left:12px;top:52px;font-size:12px;color:#b7cbdc;pointer-events:none;max-width:90vw"></div>
    <section id="match-result" hidden style="position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(85vw,520px);padding:24px;border:1px solid #a3f5bd;border-radius:20px;background:#0c1a2bee;text-align:center;">
      <h2 id="result-title"></h2><p id="result-detail" style="line-height:1.7;color:#bcd0e5"></p>
      <button class="btn btn-primary" id="result-ready">再来一局</button>
      <button class="btn btn-secondary" id="result-exit">退出房间</button>
    </section>
  </div>

<script src="fighter-engine.js?v=landscape-1.3.0"></script><script src="fight.js?v=landscape-1.3.0"></script>
  <script src="party-controller.js?v=landscape-1.3.0"></script><script src="race.js?v=landscape-1.3.0"></script>
  <script src="render.js?v=fight-background-1"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="net-view.js?v=landscape-1.3.0"></script>
  <script src="online.js?v=fight-background-1"></script>
</body>
</html>
